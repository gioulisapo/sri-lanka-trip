name: Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sri-lanka.giouliscloud.gr
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      PGDATABASE: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate configuration and prepare Worker secrets
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'SUPABASE_URL', 'SUPABASE_SECRET_KEY', 'SITE_PASSWORD', 'PGDATABASE']) {
            if (!process.env[name]) throw new Error('Missing repository setting: ' + name);
          }
          if (!process.env.SUPABASE_SECRET_KEY.startsWith('sb_secret_')) throw new Error('Use a Supabase sb_secret_ key');
          if (new URL(process.env.SUPABASE_URL).protocol !== 'https:') throw new Error('SUPABASE_URL must use HTTPS');
          writeFileSync(join(process.env.RUNNER_TEMP, 'worker-secrets.json'), JSON.stringify({
            SITE_PASSWORD: process.env.SITE_PASSWORD,
            SUPABASE_SECRET_KEY: process.env.SUPABASE_SECRET_KEY
          }), { mode: 0o600 });
          JS
      - name: Apply trip schema
        run: psql --dbname="$PGDATABASE" --no-psqlrc --set ON_ERROR_STOP=1 --single-transaction --file supabase/schema.sql
      - name: Deploy Worker and secrets together
        run: npx wrangler deploy --var "SUPABASE_URL:$SUPABASE_URL" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
