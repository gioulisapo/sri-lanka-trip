services:
  trip:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:?Set SITE_PASSWORD in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - trip-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  trip-data:
